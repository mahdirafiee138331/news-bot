name: Check feeds (with DB persistence)

on:
  schedule:
    - cron: '0 */6 * * *'   # هر 6 ساعت (UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download previous DB (if exists)
        uses: actions/download-artifact@v4
        with:
          name: bot_db
          path: .

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Force install required libs
        run: |
          python -m pip install --upgrade pip
          pip install -U "google-generativeai>=0.8.3" openai feedparser requests schedule

      - name: Run check (one-shot)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_ONCE: "1"
        run: python main.py

      - name: Upload DB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot_db
          path: bot_database.json
